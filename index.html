<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:100px;">
  <h2>Will you be my Valentine? ❤️</h2>

  <button id="yesBtn" onclick="yesClicked(this)" style="font-size:20px; position:absolute; left:40%;">
    Yes
  </button>

  <button onclick="unlockYes()" style="font-size:20px; position:absolute; left:55%;">
    No
  </button>

  <script>
    let unlocked = false;

    function yesClicked(btn) {
      if (!unlocked) {
        moveButton(btn);
      } else {
        document.body.innerHTML =
          "<h1 style='text-align:center;margin-top:100px;'>Thanks, my Valentine ❤️</h1>";
      }
    }

    function unlockYes() {
      unlocked = true;
    }

    function moveButton(btn) {
      btn.style.top = Math.random() * 400 + "px";
      btn.style.left = Math.random() * 300 + "px";
    }
  </script>
</body>
</html>
