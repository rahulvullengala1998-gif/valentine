<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:100px;">
  <h2>Will you be my Valentine? ❤️</h2>

  <button id="yesBtn" onclick="yesClicked()" style="font-size:20px;">Yes</button>
  <button id="noBtn" onclick="noClicked()" style="font-size:20px;">No</button>

  <p id="msg" style="color:red; font-size:18px;"></p>

  <script>
    let noClickedOnce = false;

    function yesClicked() {
      if (!noClickedOnce) {
        document.getElementById("msg").innerText = "Click on No first 😜";
      } else {
        document.body.innerHTML = "<h1>Thanks, my Valentine ❤️</h1>";
      }
    }

    function noClicked() {
      noClickedOnce = true;
      document.getElementById("msg").innerText = "Now click Yes ❤️";
      document.getElementById("noBtn").disabled = true;
    }
  </script>
</body>
</html>
