<!DOCTYPE html>
<html>
<head>
  <title>My Valentine</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:100px;">
  <h2>Will you be my Valentine? ❤️</h2>

  <button onclick="yesClicked()" style="font-size:20px;">Yes</button>
  <button onclick="moveButton(this)" style="font-size:20px; position:absolute;">
    No
  </button>

  <p id="msg"></p>

  <script>
    function yesClicked() {
      document.getElementById("msg").innerText = "Wait for it... ❤️";

      setTimeout(function() {
        document.body.innerHTML = "<h1>Thanks, my Valentine ❤️</h1>";
      }, 2000); // 2 seconds delay
    }

    function moveButton(btn) {
      btn.style.top = Math.random() * 400 + "px";
      btn.style.left = Math.random() * 300 + "px";
    }
  </script>
</body>
</html>
